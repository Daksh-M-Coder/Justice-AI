<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — JusticeAI</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #0f0e0c;
      --cream: #f5f0e8;
      --gold: #c8922a;
      --gold-light: #e8b84b;
      --sage: #2a4a3a;
      --paper: #faf7f2;
      --muted: #6b6560;
      --border: #d4cdc4;
      --white: #ffffff;
      --danger: #d9534f;
    }

    [data-theme="dark"] {
      --ink: #f5f0e8;
      --cream: #0f0e0c;
      --gold: #e8b84b;
      --gold-light: #c8922a;
      --sage: #2a4a3a;
      --paper: #121212;
      --muted: #a09a93;
      --border: #333333;
      --white: #1a1a1a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--gold); }

    .auth-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .auth-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      background: var(--paper);
      color: var(--ink);
      transition: all 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(200, 146, 42, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      background: var(--gold);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }

    .google-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--white);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .google-btn:hover {
      background: var(--paper);
      border-color: var(--ink);
    }

    .google-icon { width: 18px; height: 18px; }

    .switch-auth {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 1.5rem;
    }

    .switch-auth a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }

    .switch-auth a:hover { text-decoration: underline; }
  </style>
</head>

<body>

  <div class="auth-wrapper">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" class="back-link">← Back to home</a>
      <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme"
        style="font-size: 1.2rem; background: transparent; border: none; cursor: pointer; margin-bottom: 2rem;">🌙</button>
    </div>
    <div class="auth-card">
      <div style="display:flex; justify-content:center; align-items:center; margin-bottom: 0.5rem;">
        <img src="assets/logo.svg" alt="JusticeAI Logo" style="height:80px;" />
      </div>
      <div class="auth-subtitle">Create a new account to unlock cloud history.</div>

      <form id="signupForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <div id="authError" style="color:var(--danger);font-size:0.8rem;margin-top:0.5rem;display:none;"></div>
        <button type="submit" class="submit-btn" id="signupBtn">Sign Up</button>
      </form>

      <div class="divider">Or</div>

      <button type="button" class="google-btn" id="googleBtn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Continue with Google
      </button>

      <div class="switch-auth">
        <span>Already have an account?</span> <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const savedTheme = localStorage.getItem('justiceai_theme') || 'light';
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      window.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('themeToggleBtn');
        if (btn) btn.textContent = '☀️';
      });
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('justiceai_theme', next);
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
    }
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAspBA_bsCDKSuOhuxlFLWZXOCf5zPnrFs",
      authDomain: "justiceai-14c20.firebaseapp.com",
      projectId: "justiceai-14c20",
      storageBucket: "justiceai-14c20.firebasestorage.app",
      messagingSenderId: "1561810758",
      appId: "1:1561810758:web:b2ce62f387b47086303747",
      measurementId: "G-BKQSC7JQ50"
    };

    let auth;
    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    } catch (err) {
      console.warn("Firebase not properly configured yet. Using mock auth.");
    }

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authError = document.getElementById('authError');
    const signupBtn = document.getElementById('signupBtn');

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.style.display = 'none';
      if (!auth) { window.location.href = 'index.html'; return; }
      signupBtn.textContent = 'Creating account...';
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        window.location.href = 'index.html';
      } catch (error) {
        authError.textContent = error.message.replace('Firebase:', '').trim();
        authError.style.display = 'block';
      }
      signupBtn.textContent = 'Sign Up';
    });

    document.getElementById('googleBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      if (!auth) { window.location.href = 'index.html'; return; }
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        window.location.href = 'index.html';
      } catch (error) {
        authError.textContent = error.message;
        authError.style.display = 'block';
      }
    });
  </script>
</body>

</html>
